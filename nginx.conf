events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Gzip (reduce ancho de banda 50-80% en HTML/CSS/JSON) ────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml image/svg+xml
        application/x-font-ttf font/opentype application/vnd.ms-fontobject;

    # ── Rate limiting (protección DoS básica) ────────────────────────
    #
    # ANTES DE LAS ZONAS: recuperar la IP real del cliente.
    #
    # nginx no recibe la conexión del ciudadano: la recibe de ngrok, que entra
    # por el gateway de Docker. Medido el 2026-08-06 sobre el access log real:
    # el 100 % de las peticiones figuraba como 172.18.0.1 o 127.0.0.1. O sea que
    # `$binary_remote_addr` era la MISMA clave para todo el mundo y las tres
    # zonas de abajo, que se escribieron pensando "por cliente", funcionaban
    # como topes GLOBALES.
    #
    # El daño no era teórico: la zona `caracterizacion_api` se creó para frenar
    # a un bot enumerando cédulas, y en la práctica le ponía 10 peticiones por
    # minuto a TODOS los ciudadanos juntos — el sexto vecino que abría el wizard
    # en el mismo minuto recibía un 429 por culpa de los cinco anteriores.
    #
    # ngrok manda la IP del cliente en X-Forwarded-For; acá se declara de quién
    # se acepta esa cabecera (solo la red de Docker y localhost, nunca de un
    # origen arbitrario) y se la usa como IP real. `real_ip_recursive on` salta
    # los proxies confiables de la cadena hasta dar con el cliente.
    #
    # Contrapartida asumida: quien pueda pegarle a nginx DESDE el host puede
    # falsificar la cabecera y evadir su propio límite. Con nginx expuesto solo
    # por ngrok es el compromiso habitual, pero está dicho a propósito: es el
    # precio de tener límites por cliente en vez de ninguno.
    set_real_ip_from 172.18.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    # N23: zona estricta para el endpoint público que devuelve PII por
    # cédula. Mitiga enumeración masiva (bot con lista de cédulas) sin
    # impactar uso normal del wizard (1 lookup por persona, burst 5).
    limit_req_zone $binary_remote_addr zone=caracterizacion_api:10m rate=10r/m;

    # ── Caché de baldosas del mapa ───────────────────────────────────
    # 512 MB y 30 días. Una baldosa de calles no cambia, así que el
    # proveedor externo se consulta una vez por tesela y no una vez por
    # visitante. Vive en el sistema de archivos del contenedor, no en un
    # volumen: es EFÍMERA entre reinicios y da igual — se repuebla sola, y
    # agregar un volumen exigiría tocar docker-compose.yml.
    proxy_cache_path /var/cache/nginx/tiles levels=1:2
                     keys_zone=tiles:10m max_size=512m inactive=30d use_temp_path=off;
    limit_req_status 429;

    # ── Upstream con health-check pasivo + keepalive ────────────────
    upstream innova_app {
        server innova_k:8032 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 20M;

        # ── Security headers ─────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;
        # Strict-Transport-Security: descomentar cuando se sirva por HTTPS.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Health check público (sin auth, sin rate limit) ──────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── MAPA BASE SERVIDO POR NOSOTROS ───────────────────────────
        # CARTODB EMPEZÓ A EXIGIR LLAVE, y no lo dice con un error: responde
        # HTTP 200 con una baldosa de aviso. Medido el 2026-10-08: devuelve
        # EXACTAMENTE la misma imagen de 2.049 bytes para cualquier coordenada
        # —también en directo, sin pasar por acá—, con 16 colores en la paleta,
        # o sea con el aviso dibujado encima. Un 200 y un PNG válido de 256x256
        # que no es un mapa: por eso el primer diagnóstico se equivocó.
        #
        # Se pasa a OpenStreetMap, que no pide llave. Verificado que devuelve
        # teselas DISTINTAS y con contenido (2.651 / 6.530 / 2.401 / 17.384
        # bytes para cuatro coordenadas), que es la comprobación que faltaba.
        #
        # Y el proxy se queda, porque para OSM es lo correcto y no un apaño:
        # su política de uso pide caché y un identificador propio, y así las
        # peticiones salen UNA vez por tesela desde nuestro servidor en lugar
        # de una por visitante desde cada navegador. De paso, el mapa deja de
        # depender de la red de quien lo abre.
        location ~ ^/tiles/(?<tz>\d+)/(?<tx>\d+)/(?<ty>\d+)(?<tr>@2x)?\.png$ {
            # OBLIGATORIO para un proxy_pass a un host externo con nombre:
            # sin resolver, nginx no arranca. No había ninguno declarado.
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            resolver_timeout 5s;

            # OSM no sirve variante retina, así que $tr no se reenvía.
            proxy_pass https://tile.openstreetmap.org/$tz/$tx/$ty.png;
            proxy_set_header Host tile.openstreetmap.org;
            # Su política de uso EXIGE identificarse. Un User-Agent genérico
            # es motivo de bloqueo.
            proxy_set_header User-Agent "innovaK/1.0 (Alcaldia Local de Kennedy, Bogota)";
            # Sin SNI el TLS al host externo falla.
            proxy_ssl_server_name on;
            proxy_ssl_name tile.openstreetmap.org;
            # No se le reenvía a un tercero la cookie de sesión ni el referrer.
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_http_version 1.1;

            proxy_cache tiles;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Static files (cache largo, gzip) ─────────────────────────
        location /static/ {
            alias /staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ── Login con rate limit más estricto (anti brute force) ────
        location = /login/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://innova_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── N23: endpoint público que expone nombres por cédula ────
        # 10 r/min con burst 5: el wizard normal nunca lo nota
        # (1 lookup por persona); un bot enumerando recibe 429 al 6º hit.
        location = /caracterizacion/api/persona/ {
            limit_req zone=caracterizacion_api burst=5 nodelay;
            proxy_pass http://innova_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── App principal ────────────────────────────────────────────
        location / {
            limit_req zone=general burst=120 nodelay;

            proxy_pass http://innova_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Failover: muestra página amigable si app cae (502/503/504)
            proxy_intercept_errors on;
            error_page 502 503 504 = @app_down;
        }

        # ── Página de respaldo cuando innova_k está caído ────────────
        location @app_down {
            default_type text/html;
            return 503 '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Servicio en mantenimiento</title><style>body{font-family:system-ui,sans-serif;max-width:520px;margin:80px auto;padding:24px;text-align:center;color:#1f2937}h1{color:#d6001c}p{color:#6b7280;line-height:1.6}.box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:24px;margin-top:24px}</style></head><body><h1>Servicio temporalmente no disponible</h1><p>InnovaK est&aacute; siendo reiniciado. Vuelve a intentar en unos segundos.</p><div class="box"><p style="margin:0">Si el problema persiste, contacta al equipo de soporte.</p></div></body></html>';
        }
    }
}
