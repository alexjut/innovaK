events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Gzip (reduce ancho de banda 50-80% en HTML/CSS/JSON) ────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml image/svg+xml
        application/x-font-ttf font/opentype application/vnd.ms-fontobject;

    # ── Rate limiting (protección DoS básica) ────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_status 429;

    # ── Upstream con health-check pasivo + keepalive ────────────────
    upstream innova_app {
        server innova_k:8032 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 20M;

        # ── Security headers ─────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        # Strict-Transport-Security: descomentar cuando se sirva por HTTPS.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Health check público (sin auth, sin rate limit) ──────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Static files (cache largo, gzip) ─────────────────────────
        location /static/ {
            alias /staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ── Login con rate limit más estricto (anti brute force) ────
        location = /login/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://innova_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── App principal ────────────────────────────────────────────
        location / {
            limit_req zone=general burst=120 nodelay;

            proxy_pass http://innova_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Failover: muestra página amigable si app cae (502/503/504)
            proxy_intercept_errors on;
            error_page 502 503 504 = @app_down;
        }

        # ── Página de respaldo cuando innova_k está caído ────────────
        location @app_down {
            default_type text/html;
            return 503 '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Servicio en mantenimiento</title><style>body{font-family:system-ui,sans-serif;max-width:520px;margin:80px auto;padding:24px;text-align:center;color:#1f2937}h1{color:#d6001c}p{color:#6b7280;line-height:1.6}.box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:24px;margin-top:24px}</style></head><body><h1>Servicio temporalmente no disponible</h1><p>InnovaK est&aacute; siendo reiniciado. Vuelve a intentar en unos segundos.</p><div class="box"><p style="margin:0">Si el problema persiste, contacta al equipo de soporte.</p></div></body></html>';
        }
    }
}
