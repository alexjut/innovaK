<div class="kenny" [attr.data-estado]="estado()">
  <div class="kenny__stage">
    @if (esBrowser) {
      @defer (on immediate) {
        <video
          class="kenny__video"
          [src]="videoSrc()"
          autoplay
          muted
          loop
          playsinline
          aria-hidden="true"
        ></video>
      } @placeholder {
        <div class="kenny__ph" aria-hidden="true"></div>
      }
    }
  </div>

  @if (texto()) {
    <div class="kenny__bubble" role="status">{{ texto() }}</div>
  }
</div>
