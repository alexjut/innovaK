<nav class="base-top-nav" role="banner">
  <!-- Toggle sidebar -->
  <button
    type="button"
    class="base-toggle-btn"
    data-tour="menu-toggle"
    (click)="layout.toggleSidebar()"
    [attr.aria-expanded]="layout.sidebarOpen()"
    aria-label="Abrir o cerrar menú lateral"
  >
    <span class="hamburger" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>

  <!-- Logo + título centrado -->
  <div class="logo-container">
    <a routerLink="/" class="logo-link" [attr.aria-label]="cfg.appName">
      <span class="logo-text">{{ cfg.appName }}</span>
    </a>
  </div>

  <div class="base-title-wrap">
    <p class="base-subtitle">{{ cfg.alcaldiaName }}</p>
  </div>

  <!-- User dropdown -->
  <div class="base-user-info" data-tour="topbar-perfil">
    <div class="base-user-dropdown" [class.show]="dropdownOpen">
      <button
        type="button"
        class="user-dropdown-toggle"
        (click)="toggleDropdown()"
        [attr.aria-expanded]="dropdownOpen"
        aria-haspopup="menu"
      >
        <i class="fa fa-user-circle user-icon" aria-hidden="true"></i>
        <span class="base-user-name">{{ auth.displayName() }}</span>
        <i class="fa fa-chevron-down" aria-hidden="true" style="font-size: 10px"></i>
      </button>

      <ul class="dropdown-menu" [class.show]="dropdownOpen" role="menu">
        @if (auth.isAuthenticated()) {
          <li role="none">
            <a class="perfil" routerLink="/perfil" role="menuitem" (click)="dropdownOpen=false">
              <i class="fa fa-id-badge" aria-hidden="true"></i>
              <span>Mi perfil</span>
            </a>
          </li>
          <li role="none"><hr></li>
          <li role="none">
            <button type="button" class="btn-cerrar" (click)="logout()" role="menuitem">
              <i class="fa fa-sign-out-alt" aria-hidden="true"></i>
              <span>Cerrar sesión</span>
            </button>
          </li>
        } @else {
          <li role="none">
            <a class="perfil" routerLink="/auth/login" role="menuitem" (click)="dropdownOpen=false">
              <i class="fa fa-sign-in-alt" aria-hidden="true"></i>
              <span>Iniciar sesión</span>
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
