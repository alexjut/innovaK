<!-- Backdrop oscuro para móvil cuando el sidebar está abierto -->
@if (layout.sidebarOpen()) {
  <div
    class="sidebar-backdrop"
    (click)="layout.closeSidebar()"
    aria-hidden="true"
  ></div>
}

<aside
  class="base-sidebar"
  [class.active]="layout.sidebarOpen()"
  role="navigation"
  aria-label="Menú principal"
>
  <ul class="nav">
    @for (group of groups(); track group.title) {
      <li class="menu__group">
        <h3 class="menu__title">{{ group.title }}</h3>
        <ul class="menu__list">
          @for (item of group.items; track item.label) {
            <li class="sidebar-item">
              @if (item.action === 'kenny') {
                <button
                  type="button"
                  class="nav-link nav-link--kenny"
                  (click)="abrirKenny()"
                  [attr.aria-label]="item.label"
                >
                  <img src="kenny/exp-alegre.png" class="nav-kenny" alt="" aria-hidden="true" draggable="false" />
                  <span>{{ item.label }}</span>
                </button>
              } @else {
                <a
                  [routerLink]="item.route"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                  (click)="closeAndNavigate()"
                  class="nav-link"
                  [attr.aria-label]="item.label"
                >
                  <i class="fa" [class]="item.icon" aria-hidden="true"></i>
                  <span>{{ item.label }}</span>
                </a>
              }
            </li>
          }
        </ul>
      </li>
    }
  </ul>
</aside>
