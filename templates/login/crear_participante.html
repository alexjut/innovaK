{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Registro de Participante</h2>

    <p><strong>Persona:</strong> {{ persona.nombre1 }} {{ persona.apellido1 }}</p>

    <form method="post">
        {% csrf_token %}
        <!-- Aquí van los campos del participante -->
        <div class="form-group">
            <label for="rol">Rol</label>
            <input type="text" name="rol" id="rol" class="form-control">
        </div>

        <div class="form-group">
            <label for="entidad">Entidad</label>
            <input type="text" name="entidad" id="entidad" class="form-control">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="pertenece_organizacion"> Pertenece a organización
            </label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Guardar Participante</button>
    </form>
</div>
{% endblock %}
