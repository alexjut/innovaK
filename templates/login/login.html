{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-Portal</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- ✅ OJO: estás cargando base.css desde dist -->
  <link rel="stylesheet" href="{% static 'dist/css/base.css' %}?v=1" />
</head>

<body class="auth-page">

  <div class="login-wrapper">

    <!-- ✅ COLUMNA IZQUIERDA: IMAGEN -->
    <div class="login-image">
      <div class="login-media">
        <img src="{% static 'images/alcaldia.jpg' %}" alt="K-Portal" />
      </div>
    </div>

    <!-- ✅ COLUMNA DERECHA: FORM -->
    <div class="login-form-container">
      <img src="{% static 'images/logo-alcaldia-bogota.png' %}" alt="Logo" class="login-logo" />
      <h2 class="text-center mb-3"><span aria-hidden="true">🔐</span> Iniciar sesión</h2>

      {% if messages %}
      <div class="login-toast-container">
        {% for message in messages %}
        <div class="login-toast {% if message.tags == 'error' %}login-alert-error{% else %}login-alert-success{% endif %}">
          <span class="material-icons">
            {% if message.tags == "error" %}error{% else %}check_circle{% endif %}
          </span>
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <div class="login-form card p-4 shadow-sm">
        <form method="POST" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Usuario" required />
          </div>

          <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
