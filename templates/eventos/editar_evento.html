{% extends 'base.html' %}
{% block content %}
{% load widget_tweaks roles %}
<div class="container mt-4">
  <h3>✏️ Editar evento #{{ evento_id }}</h3>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label><strong>Nombre del evento (opcional):</strong></label>
      <input type="text" name="nombre_evento" value="{{ nombre_actual }}" class="form-control" placeholder="Puedes dejarlo vacío">
    </div>
    <button class="btn btn-primary">💾 Guardar</button>
    <a class="btn btn-secondary ms-2" href="{% url 'login:listar_eventos' %}">↩ Volver</a>
  </form>
</div>
{% endblock %}
