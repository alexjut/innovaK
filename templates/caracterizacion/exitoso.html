{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caracterización registrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{% static 'images/favicon_k.png' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body { background:#f5f7fa; font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .card-msg { background:#fff; border-radius:.75rem; padding:2rem 1.5rem; box-shadow:0 4px 12px rgba(0,0,0,.08); max-width:480px; text-align:center; }
    .icon-ok { width:80px; height:80px; border-radius:50%; background:#10b981; color:#fff; display:flex; align-items:center; justify-content:center; font-size:2.25rem; margin:0 auto 1rem; }
    h1 { font-size:1.4rem; color:#065f46; margin:0 0 .5rem; }
  </style>
</head>
<body>
  <div class="card-msg">
    <div class="icon-ok"><i class="fa-solid fa-check"></i></div>
    <h1>¡Listo!</h1>
    <p class="text-muted">
      Tu caracterización para el sector <strong>{{ sector_label }}</strong> quedó registrada.
      Gracias por participar en <strong>{{ evento.nombre|default:"el evento" }}</strong>.
    </p>
    <p class="text-muted small mt-3">Ya puedes cerrar esta pestaña.</p>
  </div>
</body>
</html>
