{% extends "base.html" %}
{% block content %}
<div class="container form-card mt-5">
  <h2 class="mb-4 text-center">🗓️ Registro de Asistencia - {{ clase.nombre }}</h2>
  <p><strong>📅 Fecha:</strong> {{ fecha }}</p>

  <form method="post">
    {% csrf_token %}
    <div class="table-responsive">
      <table class="table table-hover table-bordered">
        <thead class="table-light text-center">
          <tr>
            <th>👤 Participante</th>
            <th>✅ Asistió</th>
            <th>📝 Observación</th>
          </tr>
        </thead>
        <tbody>
          {% for participante in participantes %}
            <tr>
              <td>{{ participante }}</td>
              <td class="text-center">
                <input type="checkbox" name="asistencia_{{ participante.id }}" class="form-check-input">
              </td>
              <td>
                <input type="text" name="observacion_{{ participante.id }}" class="form-control" placeholder="Escriba una nota...">
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <div class="text-end">
      <button type="submit" class="btn custom-button mt-3">💾 Guardar Asistencia</button>
    </div>
  </form>
</div>
{% endblock %}
