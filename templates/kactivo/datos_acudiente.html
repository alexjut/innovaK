{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5 form-card">
  <h2 class="mb-4 text-center">👪 Registro del Acudiente</h2>

  <form method="POST">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre completo</label>
        {{ form.nombre }}
      </div>

      <div class="col-md-6">
        <label for="{{ form.parentesco.id_for_label }}" class="form-label">Parentesco</label>
        {{ form.parentesco }}
      </div>

      <div class="col-md-6">
        <label for="{{ form.telefono.id_for_label }}" class="form-label">Teléfono</label>
        {{ form.telefono }}
      </div>

      <div class="col-md-6">
        <label for="{{ form.correo.id_for_label }}" class="form-label">Correo electrónico</label>
        {{ form.correo }}
      </div>
    </div>

    <div class="mt-4 text-center">
      <button type="submit" class="btn btn-success">Guardar acudiente</button>
    </div>
  </form>
</div>
{% endblock %}
