<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ingreso staff - Votaciones</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#0b1220;color:#e6e6e6}
    .wrap{max-width:420px;margin:70px auto;background:#121a2b;border:1px solid #26324d;border-radius:12px;padding:18px}
    label{display:block;margin:10px 0 6px}
    input,button{width:100%;padding:10px;border-radius:10px;border:1px solid #2a3a60;background:#0e1626;color:#e6e6e6}
    button{border:none;background:#3b82f6;cursor:pointer;margin-top:12px}
    .msg{margin-top:10px}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Ingreso staff</h1>
    <p style="opacity:.85">Solo para organizadores / administradores.</p>

    {% if messages %}
      <div class="msg">
        {% for m in messages %}
          <div style="color:#fb7185;">• {{ m }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}"/>

      <label>Usuario</label>
      <input name="username" autocomplete="username" required />

      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" required />

      <button type="submit">Entrar</button>
    </form>

    <p style="margin-top:14px;opacity:.85">
      Volver a <a href="{% url 'votaciones:scan' %}">votar</a>
    </p>
  </div>
</body>
</html>
