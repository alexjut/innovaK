{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:720px">
  <a href="{% url 'presupuesto:proyectos_list' %}" class="btn btn-outline-secondary mb-3">← Proyectos</a>
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3">➕ Nueva Meta</h4>
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label"><strong>Nombre</strong></label>
          {{ form.nombre }}
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Guardar</button>
          <a class="btn btn-light" href="{% url 'presupuesto:proyectos_list' %}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
