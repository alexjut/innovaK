{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <a href="{% url 'presupuesto:proyectos_list' %}" class="btn btn-outline-secondary">← Proyectos</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3">➕ Nuevo indicador</h4>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label"><strong>Meta de Proyecto</strong></label>
            {{ form.meta_proyecto }}
          </div>
          <div class="col-md-6">
            <label class="form-label"><strong>Nombre</strong></label>
            {{ form.nombre }}
          </div>
          <div class="col-md-4">
            <label class="form-label"><strong>Tipo</strong></label>
            {{ form.tipo }}
          </div>
          <div class="col-md-4">
            <label class="form-label"><strong>Unidad</strong></label>
            {{ form.unidad }}
          </div>
          <div class="col-md-2">
            <label class="form-label"><strong>Línea base</strong></label>
            {{ form.linea_base }}
          </div>
          <div class="col-md-2">
            <label class="form-label"><strong>Meta</strong></label>
            {{ form.valor_meta }}
          </div>
          <div class="col-12">
            <label class="form-label"><strong>Fórmula (opcional, si tipo=DER)</strong></label>
            {{ form.formula }}
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="{% url 'presupuesto:proyectos_list' %}" class="btn btn-light">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
