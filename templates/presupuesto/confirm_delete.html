{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 680px;">
  {% include "presupuesto/_topbar.html" %}

  <div class="card border-danger">
    <div class="card-header bg-danger text-white">
      Confirmar eliminación
    </div>
    <div class="card-body">
      <p>¿Seguro que deseas eliminar <strong>{{ obj }}</strong>?</p>
      <p class="text-muted small mb-0">Esta acción no se puede deshacer.</p>
    </div>
    <div class="card-footer d-flex gap-2">
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Sí, eliminar</button>
      </form>
      <a class="btn btn-light" href="{% url 'presupuesto:conceptos_list' %}">Cancelar</a>
    </div>
  </div>
</div>
{% endblock %}
