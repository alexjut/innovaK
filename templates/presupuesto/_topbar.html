{# Barra superior reutilizable del módulo Presupuesto #}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div class="btn-group">
    <a href="{% url 'presupuesto:home' %}" class="btn btn-outline-secondary">← Presupuesto</a>
    <a href="{% url 'presupuesto:programas_list' %}" class="btn btn-outline-primary">📚 Programas</a>
    <a href="{% url 'presupuesto:proyectos_list' %}" class="btn btn-outline-primary">📁 Proyectos</a>
    <a href="{% url 'presupuesto:cdp_list' %}" class="btn btn-outline-secondary">💳 CDPs</a>
  </div>

  {% if messages %}
    <div class="ms-md-3">
      {% for m in messages %}
        <div class="alert alert-{{ m.tags|default:'info' }} py-1 px-2 mb-0 d-inline-block">{{ m }}</div>
      {% endfor %}
    </div>
  {% endif %}
</div>
<hr class="mt-0">
