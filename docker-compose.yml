services:
  innova_k_beto:
    build: .
    container_name: innova_k-beto
    restart: always
    ports:
      - "8042:8042"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=poblacion_kennedy
      - DB_USER=alex_user
      - DB_PASSWORD=alex2025.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python manage.py runserver 0.0.0.0:8042
